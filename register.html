<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="创建 5GTrip 演示账户，集中管理旅行 eSIM 和订单。">
  <title>创建账户｜5GTrip</title>
  <link rel="icon" href="assets/5gtrip-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/product-pages.css">
  <link rel="stylesheet" href="assets/language-selector.css">
</head>
<body class="auth-page">
  <a class="skip" href="#registerForm">跳到注册表单</a>
  <div class="topbar">创建账户 · 当前流程不会连接真实认证或邮件服务</div>
  <header class="site-header" data-od-id="site-header"><div class="container inner"><a class="brand" href="index.html" data-od-id="brand-logo"><img class="brand-logo-img" src="assets/images/5gtrip-logo.png" width="2170" height="725" alt="5GTrip 智能出行"></a><nav class="site-nav" aria-label="主导航" data-od-id="primary-navigation"><a href="plans.html">全部目的地</a><a href="how-to-use.html">使用方式</a><a href="faq.html">常见问题</a><a href="account.html">账户</a><a class="nav-cta" href="plans.html">获取 eSIM</a></nav></div></header>
  <main class="auth-main" data-od-id="register-page"><div class="container auth-layout register-layout"><section class="auth-visual register-visual" data-od-id="register-intro"><span class="auth-kicker">加入 5GTrip</span><h1>出发之前，先把连接准备好</h1><p>创建账户后，可集中查看订单、保存接收邮箱，并在旅途中快速找到 eSIM 安装信息。</p><div class="signup-steps"><div><b>1</b><span>填写基本资料</span></div><i></i><div><b>2</b><span>验证电子邮箱</span></div><i></i><div><b>3</b><span>进入账户中心</span></div></div><div class="signal-lines" aria-hidden="true"><i></i><i></i><i></i></div></section><section class="surface-card auth-card register-card" data-od-id="register-card"><div class="auth-card-head"><span>新用户注册</span><h2>创建 5GTrip 账户</h2><p>完成后将进入演示邮箱验证流程。</p></div><form id="registerForm" class="register-form" novalidate><div class="field-grid"><div class="field"><label for="registerName">姓名</label><input id="registerName" autocomplete="name" required placeholder="请输入姓名"><span class="field-error" data-error="name"></span></div><div class="field"><label for="registerCountry">常用国家或地区</label><select id="registerCountry" required><option value="">请选择</option><option>中国大陆</option><option>中国香港</option><option>新加坡</option><option>英国</option><option>美国</option><option>其他</option></select><span class="field-error" data-error="country"></span></div><div class="field full"><label for="registerEmail">电子邮箱</label><input id="registerEmail" type="email" autocomplete="email" required placeholder="name@example.com"><span class="field-error" data-error="email"></span></div><div class="field full"><label for="registerPassword">设置密码</label><div class="password-field"><input id="registerPassword" type="password" autocomplete="new-password" required placeholder="至少 8 位，包含字母和数字"><button type="button" data-toggle="registerPassword" aria-label="显示密码">显示</button></div><div class="password-strength" aria-live="polite"><i></i><i></i><i></i><span id="strengthLabel">尚未输入</span></div><span class="field-error" data-error="password"></span></div><div class="field full"><label for="confirmPassword">确认密码</label><div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" required placeholder="再次输入密码"><button type="button" data-toggle="confirmPassword" aria-label="显示确认密码">显示</button></div><span class="field-error" data-error="confirm"></span></div></div><label class="terms register-terms"><input id="registerTerms" type="checkbox" required><span>我已阅读并同意<a href="terms-of-service.html">服务条款</a>、<a href="privacy-policy.html">隐私政策</a>与<a href="refund-policy.html">退款说明</a>，并理解当前账户仅用于本地演示。</span></label><span class="field-error" data-error="terms"></span><button class="primary-wide" type="submit" data-od-id="register-cta">创建账户并验证邮箱</button><p class="auth-switch">已有账户？<a href="login.html">返回登录</a></p><p class="auth-disclaimer">密码只在当前页面用于校验，不会写入浏览器存储。</p></form></section></div></main>
  <footer class="auth-footer"><div class="container"><span>© 2026 5GTrip</span><nav aria-label="页脚链接"><a href="privacy-policy.html">隐私政策</a><a href="terms-of-service.html">服务条款</a><a href="faq.html">帮助中心</a><a href="contact.html">联系我们</a></nav></div></footer>
  <script>
    const form=document.querySelector('#registerForm'),nameInput=document.querySelector('#registerName'),emailInput=document.querySelector('#registerEmail'),countryInput=document.querySelector('#registerCountry'),passwordInput=document.querySelector('#registerPassword'),confirmInput=document.querySelector('#confirmPassword'),termsInput=document.querySelector('#registerTerms');
    function setError(id,message){document.querySelector(`[data-error="${id}"]`).textContent=message;const map={name:nameInput,email:emailInput,country:countryInput,password:passwordInput,confirm:confirmInput};if(map[id])map[id].classList.toggle('invalid',!!message)}function clearErrors(){['name','email','country','password','confirm','terms'].forEach(id=>setError(id,''))}
    document.querySelectorAll('[data-toggle]').forEach(button=>button.addEventListener('click',()=>{const input=document.querySelector('#'+button.dataset.toggle),showing=input.type==='text';input.type=showing?'password':'text';button.textContent=showing?'显示':'隐藏';button.setAttribute('aria-label',showing?'显示密码':'隐藏密码')}));
    function passwordScore(value){let score=0;if(value.length>=8)score++;if(/[A-Za-z]/.test(value)&&/\d/.test(value))score++;if(value.length>=12&&/[^A-Za-z0-9]/.test(value))score++;return score}passwordInput.addEventListener('input',()=>{const score=passwordScore(passwordInput.value),labels=['尚未输入','可用','良好','较强'];document.querySelectorAll('.password-strength i').forEach((bar,index)=>bar.classList.toggle('active',index<score));document.querySelector('#strengthLabel').textContent=labels[score]});
    form.addEventListener('submit',event=>{event.preventDefault();clearErrors();let valid=true;const name=nameInput.value.trim(),email=emailInput.value.trim();if(!name){setError('name','请输入姓名');valid=false}if(!countryInput.value){setError('country','请选择国家或地区');valid=false}if(!/^\S+@\S+\.\S+$/.test(email)){setError('email','请输入有效邮箱');valid=false}if(passwordScore(passwordInput.value)<2){setError('password','密码至少 8 位，并包含字母和数字');valid=false}if(confirmInput.value!==passwordInput.value){setError('confirm','两次输入的密码不一致');valid=false}if(!termsInput.checked){setError('terms','请先同意条款');valid=false}if(!valid){document.querySelector('.invalid')?.focus();return}localStorage.setItem('5gtrip-signup-draft',JSON.stringify({name,email,country:countryInput.value,createdAt:new Date().toISOString()}));location.href='verify-email.html'});
  </script>
  <script src="assets/form-accessibility.js" defer></script>
  <script src="assets/language-selector.js" defer></script>
  <script src="assets/support-chat.js" defer></script>
</body>
</html>
